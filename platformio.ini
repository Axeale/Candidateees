[platformio]
default_envs = robot

; ===== Configuración común: la heredan todos los entornos =====
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
	-Iinclude
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DCORE_DEBUG_LEVEL=1
lib_deps =
	adafruit/Adafruit PWM Servo Driver Library @ ^3.0.3
	madhephaestus/ESP32Encoder @ ^5.0.0
	adafruit/Adafruit TCS34725 @ ^1.4.4
	adafruit/Adafruit SSD1306 @ ^2.5.17
lib_extra_dirs =
	/home/axeale/ArduinoProjects/libraries/7Semi_BMI270

; ===== Programa principal: todo menos la carpeta tests/ =====
[env:robot]
build_src_filter = +<*> -<tests/>

; ===== Test de mecanum: solo ese archivo =====
[env:test_mecanum]
build_src_filter = -<*> +<tests/test_mecanum.cpp>